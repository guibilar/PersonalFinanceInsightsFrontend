name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so advisories published after the last commit still fail the audit.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production dependencies only: those ship to the browser. Dev-only advisories don't block.
      - name: Known vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - name: Browser for the unit tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Unit tests
        id: tests
        run: npm run test:ci
      # Task sessions cannot read the CI log. They can read annotations: the totals and each failed test.
      - name: Test results as annotations
        if: always() && steps.tests.outcome != 'skipped'
        run: python3 scripts/test-annotations.py test-results/junit.xml 'Unit tests'
      - name: Screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-screenshots
          path: .vitest/attachments
          if-no-files-found: ignore
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Docker Hub limits pulls without an account, and GitHub's shared runners hit it ("429 Too Many Requests").
      # Google's public mirror of Docker Hub serves the base images instead; Docker Hub is still asked for anything
      # the mirror lacks. The runner's own daemon settings are kept.
      - name: Pull base images through a mirror
        run: |
          config=/etc/docker/daemon.json
          [ -s "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '."registry-mirrors" = ["https://mirror.gcr.io"]' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format 'Mirrors: {{.RegistryConfig.Mirrors}}'
      - name: Build the image
        run: docker build -t finance-frontend .
      - name: Start it (no API behind it)
        run: |
          docker run -d --name frontend -p 5095:5095 -e API_UPSTREAM=http://127.0.0.1:9 finance-frontend
          for i in $(seq 1 30); do curl -sf http://localhost:5095/ > /dev/null && break; sleep 1; done
      - name: nginx runs as a non-root user
        run: test "$(docker exec frontend id -u)" != 0
      - name: Smoke test (headers, HTTPS handling, routing, upload limit)
        run: docker/smoke-test.sh http://localhost:5095
      - name: Container logs
        if: failure()
        run: docker logs frontend
