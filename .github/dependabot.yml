# Weekly dependency updates, grouped so a week brings a few pull requests rather than one per package.
# CI (lint, tests, build, audit, the Docker smoke test) runs on each of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Angular's packages are released together and require each other's exact versions.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "angular-eslint"
          - "@angular-eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Everything else in one pull request; a major version gets its own.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # A new Angular major goes through `ng update`, which migrates the code and moves TypeScript and
      # the other tooling with it.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      # Angular pins a TypeScript minor (22.x: >=6.0 <6.1), so only patches are safe.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node: move to the next LTS (even) major by hand; odd majors are short-lived. nginx follows its
      # stable-alpine tag, which Dependabot leaves alone.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
