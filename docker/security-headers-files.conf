# T62: the files of documents (GET /api/documents/{id}/files/{fileId}) may be framed by this site, for the PDF preview.
# The rest of security-headers.conf stays. The policy has no object-src 'none' and no sandbox: a PDF shows in the
# browser's own viewer, which those block. Only the documents module serves these files, and it checks their type
# (PDF, JPEG, PNG, HEIC, WebP) from the content on upload.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security $hsts always;
