# Included in every location: nginx drops server-level add_header lines in a location that sets its own.
# Scripts, fonts and API calls only from this origin. Styles allow 'unsafe-inline' because Angular
# injects component styles at runtime. No framing (clickjacking), no plugins.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security $hsts always;
