<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal Dropdown Test</title>
    <!--
      Temporary diagnostic page: why dropdowns inside the app's modals don't open in Waterfox (Firefox) on
      Android. A plain page, served like the app itself; modal-test.js loads the app's stylesheet. Remove it
      once the cause is fixed.
    -->
    <style>
      body {
        margin: 0;
      }
      .shell {
        display: flex;
        min-height: 100vh;
      }
      main {
        flex: 1;
        min-width: 0;
        outline: none;
      }
      .inner {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 2rem;
      }
      .test-list {
        display: grid;
        gap: 0.625rem;
        margin: 0 0 1.25rem;
        padding: 0;
        list-style: none;
      }
      .test-list button {
        width: 100%;
        text-align: left;
      }
      .log {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 14rem;
        overflow: auto;
        margin: 0.75rem 0 0;
        padding: 0.5rem;
        border: 1px solid var(--bs-border-color, #ccc);
        border-radius: 0.375rem;
        background: var(--bs-tertiary-bg, #f4f4f4);
      }
      /* The app's modal (shared/ui/modal), reproduced. */
      .modal-backdrop-layer {
        position: fixed;
        inset: 0;
        z-index: 1050;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1rem 0.5rem;
        overflow-y: auto;
        background: rgb(0 0 0 / 0.45);
        animation: fade-in 0.15s ease-out;
      }
      .modal-dialog-box {
        width: min(32rem, 100%);
        margin: auto 0;
        background: var(--bs-body-bg, #fff);
        border: 1px solid var(--bs-border-color, #ccc);
        border-radius: 0.5rem;
        outline: none;
        animation: fade-in 0.18s ease-out;
      }
      .modal-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--bs-border-color, #ccc);
      }
      .modal-body-area {
        padding: 1.25rem;
      }
      .layer-absolute {
        position: absolute;
        inset: auto 0 auto 0;
        min-height: 100vh;
      }
      dialog.native {
        width: min(32rem, calc(100% - 1rem));
        padding: 0;
        border: 1px solid var(--bs-border-color, #ccc);
        border-radius: 0.5rem;
        background: var(--bs-body-bg, #fff);
        color: var(--bs-body-color, #000);
      }
      dialog.native::backdrop {
        background: rgb(0 0 0 / 0.45);
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main id="main-content" tabindex="-1">
        <div class="inner">
          <h1 class="h4">Modal Dropdown Test</h1>
          <p class="text-body-secondary">
            Tap a test, then tap its <strong>Account</strong> dropdown and note whether the list
            appears. Try each one, then send the letters that opened, plus a screenshot of the log
            for test B.
          </p>
          <ul class="test-list" id="tests"></ul>
          <label class="form-label" for="page-account"
            >P · On the page, no modal (should open)</label
          >
          <select id="page-account" class="form-select">
            <option value="" disabled selected>Select the account</option>
            <option>Chequing · Chequing</option>
            <option>Visa · Credit card</option>
          </select>
          <h2 class="h6 mt-4">Log</h2>
          <div class="log" id="page-log">Nothing yet.</div>
        </div>
      </main>
    </div>
    <!-- The query string gets past nginx caching unhashed .js files for good. -->
    <script src="modal-test.js?v=1"></script>
  </body>
</html>
