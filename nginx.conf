server {
    listen 5095;

    server_name localhost;

    root /usr/share/nginx/html/PersonalFinancesFrontend/browser;
    index index.html;

    location / {
        # Serve files directly if found, otherwise fallback to index.html (for SPAs)
        try_files $uri /index.html;
    }

    # Redirect 404 errors to index.html for Angular SPA routing
    error_page 404 /index.html;

    # Optimizations for static resources (optional but recommended)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|html|map)$ {
        expires 6M;
        access_log off;
    }
}
