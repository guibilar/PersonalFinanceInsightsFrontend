<div class="form-container">
  <div class="form-header">
    <h3>Linking Transaction</h3>
  </div>

  <form (ngSubmit)="onSubmit()" #TransactionForm="ngForm">
    <div class="form-group">
      <label for="budget">Budget *</label>
      <select
        id="budget"
        name="budget"
        [(ngModel)]="formData.BudgetId"
        required
        class="form-control">
        <option [ngValue]="''" disabled>Select a budget</option>
        @for (option of budgets; track option.id) {
          <option [ngValue]="option.id">{{ option.name }}</option>
        }
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="!isValid()">Link</button>
    </div>
  </form>
</div>
