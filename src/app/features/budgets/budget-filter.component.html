<form [formGroup]="form" (ngSubmit)="applyFilter()">
  <app-filter-panel (clear)="clearFilter()">
    <div class="col-12 col-md-6 col-xl-3">
      <label for="budget-filter-name" class="form-label">Name</label>
      <input
        type="text"
        id="budget-filter-name"
        class="form-control"
        formControlName="name"
        placeholder="Search by name"
      />
    </div>

    <div class="col-12 col-md-6 col-xl-3">
      <label for="budget-filter-description" class="form-label">Description</label>
      <input
        type="text"
        id="budget-filter-description"
        class="form-control"
        formControlName="description"
        placeholder="Search by description"
      />
    </div>

    <div class="col-12 col-md-6 col-xl-3">
      <label for="budget-filter-status" class="form-label">Status</label>
      <select id="budget-filter-status" class="form-select" formControlName="status">
        @for (option of statusOptions; track option.label) {
          <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="col-12 col-md-6 col-xl-3">
      <label for="budget-filter-page-size" class="form-label">Items per page</label>
      <select id="budget-filter-page-size" class="form-select" formControlName="pageSize">
        @for (size of pageSizeOptions; track size) {
          <option [ngValue]="size">{{ size }}</option>
        }
      </select>
    </div>
  </app-filter-panel>
</form>
