<div class="form-container">
  <div class="form-header">
    <h3>Linking Transaction</h3>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="link-budget">Budget *</label>
      <select id="link-budget" formControlName="budgetId" class="form-control">
        <option value="" disabled>Select a budget</option>
        @for (option of budgets(); track option.id) {
          <option [value]="option.id">{{ option.name }}</option>
        }
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Link</button>
    </div>
  </form>
</div>
