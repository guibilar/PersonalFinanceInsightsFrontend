<div class="card mb-3">
  <form
    class="card-body d-flex flex-wrap align-items-end gap-2 py-3"
    [formGroup]="form"
    (submit)="$event.preventDefault()"
  >
    <div class="flex-grow-1" style="min-width: 14rem">
      <label for="tx-search" class="visually-hidden">Search descriptions</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent text-body-secondary"
          ><app-icon name="search" [size]="16"
        /></span>
        <input
          type="search"
          id="tx-search"
          class="form-control border-start-0"
          placeholder="Search descriptions"
          formControlName="description"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="flex-grow-1 flex-md-grow-0">
      <label for="tx-category" class="visually-hidden">Category</label>
      <select id="tx-category" class="form-select" formControlName="categoryId">
        <option [ngValue]="null">All categories</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>

    <div class="flex-grow-1 flex-md-grow-0">
      <label for="tx-account" class="visually-hidden">Account</label>
      <select id="tx-account" class="form-select" formControlName="accountId">
        <option [ngValue]="null">All accounts</option>
        @for (account of accounts(); track account.id) {
          <option [ngValue]="account.id">{{ account.name }}</option>
        }
      </select>
    </div>

    <div class="flex-grow-1 flex-md-grow-0">
      <label for="tx-flow" class="visually-hidden">Flow</label>
      <select id="tx-flow" class="form-select" formControlName="flow">
        <option [ngValue]="null">All flows</option>
        @for (flow of flows; track flow) {
          <option [ngValue]="flow">{{ flowLabels[flow] }}</option>
        }
      </select>
    </div>

    <div class="flex-grow-1 flex-md-grow-0">
      <label for="tx-period" class="visually-hidden">Dates</label>
      <select id="tx-period" class="form-select" formControlName="period">
        <option value="all">All dates</option>
        @for (preset of datePresets; track preset.id) {
          <option [value]="preset.id">{{ preset.label }}</option>
        }
        <option value="custom">Custom range…</option>
      </select>
    </div>

    @if (customRange()) {
      <div class="d-flex flex-wrap gap-2 flex-grow-1 flex-md-grow-0">
        <div class="d-flex align-items-center gap-2 flex-grow-1">
          <label for="tx-from" class="small text-body-secondary">From</label>
          <input
            type="date"
            id="tx-from"
            class="form-control"
            formControlName="startDate"
            [class.is-invalid]="rangeBackwards()"
            [attr.aria-describedby]="rangeBackwards() ? 'tx-range-error' : null"
          />
        </div>
        <div class="d-flex align-items-center gap-2 flex-grow-1">
          <label for="tx-to" class="small text-body-secondary">To</label>
          <input
            type="date"
            id="tx-to"
            class="form-control"
            formControlName="endDate"
            [class.is-invalid]="rangeBackwards()"
            [attr.aria-describedby]="rangeBackwards() ? 'tx-range-error' : null"
          />
        </div>
        @if (rangeBackwards()) {
          <div id="tx-range-error" class="w-100 small text-danger" role="alert">
            The range ends before it starts. The list shows the last range that made sense.
          </div>
        }
      </div>
    }
  </form>

  @if (chips().length > 0) {
    <div class="card-footer bg-transparent d-flex flex-wrap align-items-center gap-2 py-2">
      <span class="small text-body-secondary">Filtered by</span>
      @for (chip of chips(); track chip.key) {
        <span
          class="badge rounded-pill bg-body-secondary text-body border d-inline-flex align-items-center gap-1 fw-medium"
        >
          {{ chip.label }}
          <button
            type="button"
            class="btn btn-link p-0 lh-1 text-body-secondary"
            [attr.aria-label]="'Remove filter ' + chip.label"
            (click)="remove(chip.key)"
          >
            <app-icon name="close" [size]="12" />
          </button>
        </span>
      }
      <button type="button" class="btn btn-link btn-sm p-0 ms-1" (click)="clearAll()">
        Clear all
      </button>
    </div>
  }
</div>
