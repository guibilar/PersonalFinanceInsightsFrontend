<app-form-card title="Import Statement">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="text-body-secondary small">
      Upload a CIBC CSV export. Transactions that were already imported are skipped, so overlapping
      statements are safe to upload.
    </p>

    <div class="mb-3">
      <label for="import-account" class="form-label">Account *</label>
      <select
        id="import-account"
        class="form-select"
        formControlName="account"
        [class.is-invalid]="form.controls.account.invalid && form.controls.account.touched"
      >
        <option [ngValue]="null" disabled>Select the account</option>
        @for (option of accountOptions; track option.value) {
          <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
      <div class="invalid-feedback">Choose which account the statement is from.</div>
    </div>

    <div class="mb-3">
      <label for="import-file" class="form-label">Statement file (.csv) *</label>
      <input
        #fileInput
        type="file"
        id="import-file"
        class="form-control"
        accept=".csv,text/csv"
        [class.is-invalid]="fileError()"
        (change)="onFileSelected(fileInput)"
      />
      @if (fileError(); as message) {
        <div class="invalid-feedback">{{ message }}</div>
      }
    </div>

    @if (error(); as message) {
      <div class="alert alert-danger py-2" role="alert">{{ message }}</div>
    }

    <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 border-top pt-3">
      <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || !file() || uploading()"
      >
        @if (uploading()) {
          <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
          Importing…
        } @else {
          Import
        }
      </button>
    </div>
  </form>
</app-form-card>
