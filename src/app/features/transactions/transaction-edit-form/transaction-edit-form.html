<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="rounded bg-body-tertiary p-3 mb-3 small text-body-secondary">
    {{ transaction().date | date: 'mediumDate' : 'UTC' }} · {{ transaction().amount | currency }} ·
    {{ transaction().account }}
  </div>

  <div class="mb-3">
    <label for="edit-description" class="form-label">Description *</label>
    <input
      type="text"
      id="edit-description"
      class="form-control"
      formControlName="description"
      [class.is-invalid]="form.controls.description.invalid && form.controls.description.touched"
    />
    <div class="invalid-feedback">Description is required.</div>
  </div>

  <div class="mb-3">
    <label for="edit-category" class="form-label">Category *</label>
    <select id="edit-category" class="form-select" formControlName="category">
      @for (category of categories; track category) {
        <option [ngValue]="category">{{ category }}</option>
      }
    </select>
    <div class="form-text">
      If you change the category, your choice is kept when category rules are re-applied.
    </div>
  </div>

  <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 border-top pt-3">
    <button
      type="button"
      class="btn btn-outline-danger me-sm-auto"
      [disabled]="saving()"
      (click)="deleteRequested.emit()"
    >
      Delete…
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </div>
</form>
