<div class="categorized-table-container">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Category</th>
        <th>Expenditure (in CAD)</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of currentMonth()?.categoryValues | keyvalue; track entry.key) {
        <tr>
          <td>
            <span class="category-dot" [style.background-color]="getCategoryColor(entry.key)"></span
            >{{ entry.key }}
          </td>
          <td>{{ entry.value | currency }}</td>
        </tr>
      }
      <tr class="fw-bold">
        <td>Total</td>
        <td>{{ currentMonth()?.total ?? 0 | currency }}</td>
      </tr>
    </tbody>
  </table>
</div>
