@if (isLoading) {
  <div class="text-center">
    <app-loader></app-loader>
  </div>
} @else {
  <div class="categorized-table-container">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Category</th>
          <th>Expenditure (in CAD)</th>
        </tr>
      </thead>
      <tbody>
        @for (category of Object.keys(categorizedData) ; track category) {
          <tr>
            <td [style.color]="getCategoryColor(category)">{{ category }}</td>
            <td>{{ categorizedData[category] | currency }}</td>
          </tr>
        }
        <tr class="font-weight-bold">
          <td>Total</td>
          <td>{{ calculateTotal | currency }}</td>
        </tr>
      </tbody>
    </table>
  </div>
}
