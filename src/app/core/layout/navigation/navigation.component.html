<nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a routerLink="/" class="navbar-brand fw-bold" (click)="closeMenu()">Personal Finances</a>

    <button type="button" class="navbar-toggler" aria-controls="main-nav" aria-label="Toggle navigation"
            [attr.aria-expanded]="isMenuOpen()" (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="main-nav" class="collapse navbar-collapse" [class.show]="isMenuOpen()">
      <ul class="navbar-nav ms-auto">
        @for (link of links; track link.path) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: link.exact }" ariaCurrentWhenActive="page" (click)="closeMenu()">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
