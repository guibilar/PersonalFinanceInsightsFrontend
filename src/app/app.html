@if (navigation.failedUrl()) {
  <main class="container py-5 text-center" style="max-width: 32rem">
    <h1 class="h4 mb-2">Couldn't reach Hestia</h1>
    <p class="text-body-secondary mb-4">
      The server didn't answer. It may be restarting, or this device may be offline.
    </p>
    <button type="button" class="btn btn-primary" (click)="navigation.retry()">Try again</button>
  </main>
}
<router-outlet />
<app-toast-container />
